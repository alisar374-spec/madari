<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مداري | الموقع تحت الإنشاء</title>
  <meta name="description" content="موقع مداري - madari.com.sa - قريبًا">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1020;
      --bg-2: #121a33;
      --text: #eef1f8;
      --muted: #9aa4bf;
      --accent: #3fb6a8;
      --accent-2: #f2b84b;
      --ring: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Tajawal", system-ui, sans-serif;
      background: radial-gradient(ellipse at top, var(--bg-2), var(--bg) 70%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 24px 16px;
    }

    main {
      text-align: center;
      max-width: 640px;
      width: 100%;
    }

    /* المدار */
    .orbit {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto 40px;
    }

    .ring {
      position: absolute;
      inset: 0;
      border: 1px solid var(--ring);
      border-radius: 50%;
    }

    .ring.r2 { inset: 30px; }
    .ring.r3 { inset: 60px; }

    .core {
      position: absolute;
      inset: 85px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #2a7f9e);
      box-shadow: 0 0 40px rgba(63, 182, 168, 0.45);
    }

    .spin {
      position: absolute;
      inset: 0;
      animation: spin 12s linear infinite;
    }

    .spin.s2 { inset: 30px; animation-duration: 8s; animation-direction: reverse; }
    .spin.s3 { inset: 60px; animation-duration: 5s; }

    .planet {
      position: absolute;
      top: -6px;
      left: 50%;
      width: 12px;
      height: 12px;
      margin-left: -6px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 14px var(--accent-2);
    }

    .s2 .planet { width: 9px; height: 9px; margin-left: -4.5px; top: -4.5px; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    .s3 .planet { width: 7px; height: 7px; margin-left: -3.5px; top: -3.5px; background: #fff; box-shadow: 0 0 10px #fff; }

    @keyframes spin { to { transform: rotate(360deg); } }

    h1 {
      font-size: clamp(2.8rem, 9vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .domain {
      color: var(--muted);
      font-size: 1rem;
      direction: ltr;
      margin-bottom: 32px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border: 1px solid rgba(242, 184, 75, 0.35);
      background: rgba(242, 184, 75, 0.08);
      color: var(--accent-2);
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.7); }
    }

    p.lead {
      font-size: 1.2rem;
      line-height: 1.9;
      color: var(--muted);
    }

    footer {
      margin-top: 56px;
      color: var(--muted);
      font-size: 0.85rem;
      opacity: 0.7;
    }

    @media (prefers-reduced-motion: reduce) {
      .spin, .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="orbit" aria-hidden="true">
      <div class="ring"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="core"></div>
      <div class="spin"><span class="planet"></span></div>
      <div class="spin s2"><span class="planet"></span></div>
      <div class="spin s3"><span class="planet"></span></div>
    </div>

    <h1>مداري</h1>
    <div class="domain">madari.com.sa</div>

    <div class="badge"><span class="dot"></span> الموقع تحت الإنشاء</div>

    <p class="lead">نعمل حاليًا على تجهيز تجربة جديدة ومميزة لكم.<br>ترقبونا قريبًا.</p>

    <footer>© <span id="year">2026</span> مداري. جميع الحقوق محفوظة.</footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
