<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Madari">
  <defs>
    <radialGradient id="globe" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#2B4A7A"/>
      <stop offset="55%" stop-color="#132A4C"/>
      <stop offset="100%" stop-color="#08162B"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBD9A8"/>
      <stop offset="50%" stop-color="#C9A45C"/>
      <stop offset="100%" stop-color="#9C7A3C"/>
    </linearGradient>
    <clipPath id="clip"><circle cx="50" cy="50" r="24"/></clipPath>
  </defs>

  <!-- orbit A (back half) -->
  <g transform="rotate(-22 50 50)">
    <path d="M92,50 A42,13 0 0,0 8,50" fill="none" stroke="url(#gold)" stroke-width="1.1" opacity=".45"/>
  </g>
  <!-- orbit B (back half) -->
  <g transform="rotate(28 50 50)">
    <path d="M90,50 A40,11 0 0,0 10,50" fill="none" stroke="#9FB6D6" stroke-width=".9" opacity=".35"/>
  </g>

  <!-- globe -->
  <circle cx="50" cy="50" r="24" fill="url(#globe)"/>
  <g clip-path="url(#clip)" fill="none" stroke="#C9A45C" stroke-width=".6" opacity=".55">
    <ellipse cx="50" cy="50" rx="24" ry="8"/>
    <line x1="26" y1="50" x2="74" y2="50"/>
    <ellipse cx="50" cy="38" rx="21" ry="5" opacity=".7"/>
    <ellipse cx="50" cy="62" rx="21" ry="5" opacity=".7"/>
    <g>
      <ellipse cx="50" cy="50" rx="9" ry="24"/>
      <ellipse cx="50" cy="50" rx="18" ry="24" opacity=".7"/>
      <animateTransform attributeName="transform" type="translate" values="-9 0; 9 0" dur="6s" repeatCount="indefinite"/>
    </g>
    <line x1="50" y1="26" x2="50" y2="74"/>
  </g>
  <circle cx="50" cy="50" r="24" fill="none" stroke="url(#gold)" stroke-width="1.2"/>
  <circle cx="42" cy="41" r="9" fill="#fff" opacity=".06"/>

  <!-- orbit A (front half + satellite) -->
  <g transform="rotate(-22 50 50)">
    <path d="M92,50 A42,13 0 0,1 8,50" fill="none" stroke="url(#gold)" stroke-width="1.4"/>
    <circle r="3.2" fill="#E6CC8A">
      <animateMotion dur="7s" repeatCount="indefinite" path="M92,50 A42,13 0 1,1 8,50 A42,13 0 1,1 92,50"/>
      <animate attributeName="opacity" values="1;1;.25;.25;1" keyTimes="0;.48;.52;.98;1" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- orbit B (front half + satellite) -->
  <g transform="rotate(28 50 50)">
    <path d="M90,50 A40,11 0 0,1 10,50" fill="none" stroke="#9FB6D6" stroke-width="1"/>
    <circle r="2.3" fill="#FFFFFF">
      <animateMotion dur="4.6s" repeatCount="indefinite" begin="-1.5s" path="M10,50 A40,11 0 1,0 90,50 A40,11 0 1,0 10,50"/>
      <animate attributeName="opacity" values="1;1;.2;.2;1" keyTimes="0;.48;.52;.98;1" dur="4.6s" begin="-1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
